<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividades de Transmissão</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gd:#8CBF3F;--gm:#8CBF3F;--gl:#f4f9ec;
  --g50:#f7f8fa;--g100:#eef0f3;--g300:#d0d5dd;
  --g500:#6b7585;--g800:#2d3444;--bdr:#d4ddd8;--r:8px;
  --c-preventiva:#8CBF3F;--c-manutencao:#e07b00;--c-transceiver:#1565c0;--c-infra:#5e35b1;--c-outro:#6b7585;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:#ecf0eb;color:var(--g800);font-size:14px;min-height:100vh;padding:0 0 60px}

.fhd{background:var(--gd);padding:20px 32px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.lz{flex-shrink:0;width:180px;height:80px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;border-radius:10px;padding:8px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lz img{width:100%;height:100%;object-fit:contain}
.hi h1{font-size:20px;font-weight:700;color:#fff;margin-bottom:2px}
.hi p{font-size:12px;color:rgba(255,255,255,.65)}
.btn-voltar-painel{margin-left:auto;padding:8px 16px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.btn-voltar-painel:hover{background:rgba(255,255,255,.25)}

.wrap{max-width:1500px;margin:20px auto;padding:0 16px;display:flex;flex-direction:column;gap:20px}

/* CALENDAR HEADER */
.cal-card{background:#fff;border-radius:12px;border:1px solid var(--bdr);overflow:hidden;box-shadow:0 2px 8px rgba(26,92,55,.07)}
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bdr);flex-wrap:wrap;gap:12px}
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-nav button{width:34px;height:34px;border:1px solid var(--bdr);background:#fff;border-radius:8px;font-size:16px;cursor:pointer;color:var(--g800);display:flex;align-items:center;justify-content:center}
.cal-nav button:hover{background:var(--g50)}
.cal-title{font-size:17px;font-weight:700;color:var(--g800);min-width:170px;text-align:center;text-transform:capitalize}
.btn-hoje{padding:8px 14px;border:1px solid var(--bdr);background:#fff;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--g800)}
.btn-hoje:hover{background:var(--g50)}
.btn-novo{padding:9px 18px;border:none;background:var(--gd);color:#fff;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-novo:hover{filter:brightness(1.08)}

/* GRID */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-body{display:block}
.week-row{position:relative}
.week-days{display:grid;grid-template-columns:repeat(7,1fr)}
.week-events{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:22px;row-gap:3px;padding:30px 0 4px;pointer-events:none;overflow:hidden}
.ev-bar{border-radius:6px;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin:0 2px}
.ev-more{align-self:center;font-size:10px;color:var(--g500);font-weight:700;padding:0 8px}
.cal-dow{padding:10px 6px;text-align:center;font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;background:var(--gl);border-bottom:1px solid var(--bdr)}
.cal-day{
  height:130px;border-right:1px solid var(--g100);border-bottom:1px solid var(--g100);
  padding:8px 6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;
  transition:background .1s;overflow:hidden;
}
.cal-day:hover{background:var(--g50)}
.cal-day:nth-child(7n){border-right:none}
.cal-day.out{background:#fafbfa}
.cal-day.out .day-num{color:var(--g300)}
.cal-day.today{background:#fbfff0}
.day-num{font-size:13px;font-weight:700;color:var(--g800);margin-bottom:2px}
.day-num.sun{color:#e05353}
.day-num.sat{color:#1565c0}
.cal-day.today .day-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--gd);color:#fff!important}
.add-hint{position:absolute;top:6px;right:6px;font-size:16px;color:var(--g300);opacity:0;transition:opacity .1s}
.cal-day:hover .add-hint{opacity:1}

/* SIDEBAR */
.side-card{background:#fff;border-radius:12px;border:1px solid var(--bdr);padding:18px;box-shadow:0 2px 8px rgba(26,92,55,.07);margin-bottom:16px}
.side-card h3{font-size:12px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.legend-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;cursor:pointer;user-select:none}
.busca-wrap{position:relative;flex:1;min-width:160px;max-width:280px}
.busca-input{width:100%;padding:9px 14px;border:1px solid var(--bdr);border-radius:8px;font-size:13px;font-family:inherit;outline:none;color:var(--g800)}
.busca-input:focus{border-color:var(--gd);box-shadow:0 0 0 3px rgba(140,191,63,.15)}
.busca-resultados{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--bdr);border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.15);max-height:320px;overflow-y:auto;z-index:50}
.busca-resultados.show{display:block}
.busca-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--g100);font-size:13px}
.busca-item:last-child{border-bottom:none}
.busca-item:hover{background:var(--g50)}
.busca-item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.busca-item .titulo{flex:1;font-weight:600;color:var(--g800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.busca-item .data{font-size:11px;color:var(--g500);flex-shrink:0}
.busca-empty{padding:14px;text-align:center;font-size:12.5px;color:var(--g500)}
.legend-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.legend-item.off{opacity:.35}
.upcoming-item{padding:10px 0;border-bottom:1px solid var(--g100);font-size:12.5px}
.upcoming-item:last-child{border-bottom:none}
.upcoming-date{font-size:10px;font-weight:700;color:var(--gd);text-transform:uppercase;margin-bottom:3px}
.upcoming-title{font-weight:600;color:var(--g800);margin-bottom:2px}
.upcoming-meta{color:var(--g500);font-size:11px}
.empty-upcoming{font-size:12px;color:var(--g500);padding:8px 0}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(20,30,20,.5);z-index:2000;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}

/* DAY MODAL */
.day-modal{background:#fff;border-radius:16px;max-width:480px;width:100%;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:88vh;display:flex;flex-direction:column}
.day-modal-hd{padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--g100)}
.day-modal-hd h2{font-size:19px;font-weight:800;color:var(--g800);text-transform:capitalize}
.day-modal-hd-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.day-add-btn{width:38px;height:38px;border-radius:50%;background:var(--g800);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.day-add-btn:hover{background:#1c222b}
.day-close-btn{width:34px;height:34px;border-radius:50%;background:var(--g50);color:var(--g500);border:none;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.day-close-btn:hover{background:var(--g100)}
.day-modal-body{padding:8px 20px 20px;overflow-y:auto}
.day-ev-row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--g100);cursor:pointer}
.day-ev-row:last-child{border-bottom:none}
.day-ev-row:hover{background:var(--g50);margin:0 -20px;padding:16px 20px;border-radius:8px}
.day-ev-time{font-size:13px;font-weight:700;color:var(--g800);text-align:right;min-width:46px;line-height:1.5}
.day-ev-time .fim{color:var(--g300);font-weight:600}
.day-ev-bar{width:3px;align-self:stretch;border-radius:3px;flex-shrink:0}
.day-ev-info{flex:1;min-width:0}
.day-ev-title{font-size:15px;font-weight:700;color:var(--g800);display:flex;align-items:center;gap:6px}
.day-ev-meta{font-size:12px;color:var(--g500);margin-top:3px}
.day-ev-avatar{width:34px;height:34px;border-radius:50%;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.day-empty{padding:30px 0;text-align:center;color:var(--g500);font-size:13px}

/* DETAIL VIEW */
.det-modal{background:#fff;border-radius:16px;max-width:480px;width:100%;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:92vh;display:flex;flex-direction:column}
.det-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 0}
.det-back{width:36px;height:36px;border-radius:50%;border:none;background:var(--g50);color:var(--g800);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.det-back:hover{background:var(--g100)}
.det-menu-wrap{position:relative;flex-shrink:0}
.det-menu-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--g50);color:var(--g800);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.det-menu-btn:hover{background:var(--g100)}
.det-menu-dd{display:none;position:absolute;right:0;top:42px;background:#fff;border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.18);border:1px solid var(--bdr);min-width:200px;z-index:10;overflow:hidden}
.det-menu-dd.show{display:block}
.det-menu-item{padding:12px 16px;font-size:13.5px;font-weight:600;color:var(--g800);cursor:pointer;display:flex;align-items:center;gap:10px}
.det-menu-item:hover{background:var(--g50)}
.det-menu-item.danger{color:#c0392b}
.det-avatar-wrap{text-align:center;padding:4px 20px 0}
.det-avatar{width:56px;height:56px;border-radius:50%;color:#fff;font-size:22px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.det-title{text-align:center;font-size:24px;font-weight:800;padding:14px 20px 4px}
.det-date{text-align:center;font-size:16px;font-weight:700;color:var(--g800);padding:0 20px 14px;text-transform:capitalize}
.det-body{overflow-y:auto;padding:0 20px 16px}
.det-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--g100);font-size:14px;color:var(--g800)}
.det-row .ico{font-size:17px;width:20px;text-align:center;flex-shrink:0}
.det-row .txt{flex:1;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.det-row .txt small{display:block;color:var(--g500);font-size:11px;margin-top:2px}

.det-form-cta{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:12px;color:#fff;font-size:13.5px;font-weight:700;text-decoration:none;margin-top:14px}
.det-form-cta:hover{filter:brightness(1.06)}
.det-form-cta .arrow{margin-left:auto;font-size:16px}

.det-status-title{font-size:11px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-top:16px;margin-bottom:8px}
.det-status-picker{display:flex;gap:8px;flex-wrap:wrap}
.det-status-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;border:2px solid var(--bdr);font-size:12px;font-weight:700;color:var(--g500);cursor:pointer;background:#fff}
.det-status-opt .dot{width:8px;height:8px;border-radius:50%;background:var(--g300)}
.det-status-opt.sel{color:#fff;border-color:transparent}
.det-status-save{margin-top:10px;width:100%;justify-content:center;display:flex;align-items:center;gap:6px}

.det-section-title{font-size:11px;font-weight:800;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
.det-attach-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.det-attach-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px dashed var(--g300);border-radius:20px;background:#fff;font-size:12.5px;font-weight:700;color:var(--g500);cursor:pointer}
.det-attach-btn:hover{border-color:var(--gd);color:var(--gd);background:var(--gl)}
.det-fotos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.det-foto-item{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--g100)}
.det-foto-item img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.det-foto-rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.det-pdf-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--bdr);border-radius:8px;margin-bottom:6px;font-size:12.5px}
.det-pdf-item a{flex:1;color:var(--g800);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det-pdf-item a:hover{color:var(--gd)}
.det-pdf-rm{background:none;border:none;color:#c0392b;cursor:pointer;font-size:13px;flex-shrink:0}

.det-comment{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--g100)}
.det-comment:last-child{border-bottom:none}
.det-comment-av{width:28px;height:28px;border-radius:50%;background:var(--g300);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.det-comment-body{flex:1;font-size:13px;color:var(--g800);line-height:1.4}
.det-comment-meta{font-size:10.5px;color:var(--g500);margin-top:2px}
.det-comment-empty{font-size:12.5px;color:var(--g500);padding:6px 0}

.det-comment-input-row{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--bdr);flex-shrink:0}
.det-comment-input-row input{flex:1;padding:10px 14px;border:1px solid var(--bdr);border-radius:20px;font-size:13px;font-family:inherit;outline:none}
.det-comment-input-row input:focus{border-color:var(--gd)}
.det-comment-send{width:38px;height:38px;border-radius:50%;background:var(--gd);color:#fff;border:none;font-size:15px;cursor:pointer;flex-shrink:0}
.det-comment-send:hover{filter:brightness(1.08)}

/* COPY MODAL */
.copy-modal{background:#fff;border-radius:14px;max-width:340px;width:100%;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.copy-modal-hd{padding:18px 20px 4px}
.copy-modal-hd h3{font-size:15px;font-weight:700;color:var(--g800)}
.copy-modal-body{padding:12px 20px 20px}
.copy-modal-actions{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--bdr)}

/* FOTO AMPLIADA */
.foto-ampliada-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:3000;align-items:center;justify-content:center;padding:24px}
.foto-ampliada-bg.show{display:flex}
.foto-ampliada-bg img{max-width:100%;max-height:90vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.foto-ampliada-close{position:absolute;top:18px;right:22px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.foto-ampliada-close:hover{background:rgba(255,255,255,.28)}
.ev-modal{background:#fff;border-radius:14px;max-width:460px;width:100%;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:92vh;display:flex;flex-direction:column}
.ev-modal-hd{background:var(--gd);padding:16px 20px;color:#fff;display:flex;align-items:center;justify-content:space-between}
.ev-modal-hd h3{font-size:15px;font-weight:700}
.ev-modal-hd .close-x{cursor:pointer;font-size:18px;background:none;border:none;color:#fff;opacity:.85}
.ev-modal-hd .close-x:hover{opacity:1}
.ev-modal-body{padding:20px;overflow-y:auto}
.ev-fld{margin-bottom:14px}
.ev-fld label{display:block;font-size:10px;font-weight:700;color:var(--g500);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.ev-fld input,.ev-fld select,.ev-fld textarea{width:100%;padding:9px 11px;border:1px solid var(--bdr);border-radius:var(--r);font-size:13.5px;font-family:inherit;color:var(--g800);outline:none}
.ev-fld input:focus,.ev-fld select:focus,.ev-fld textarea:focus{border-color:var(--gd);box-shadow:0 0 0 3px rgba(140,191,63,.15)}
.ev-fld textarea{resize:vertical;min-height:60px}
.ev-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dia-todo-lbl{display:flex!important;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--g800);text-transform:none!important;letter-spacing:normal!important}
.dia-todo-lbl input{width:auto!important;accent-color:var(--gd)}
.cat-picker{display:flex;gap:8px;flex-wrap:wrap}
.cat-opt{display:flex;align-items:center;gap:6px;padding:7px 12px;border:2px solid var(--bdr);border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;color:var(--g500)}
.cat-opt.sel{border-color:currentColor}
.tec-picker{display:flex;gap:8px;flex-wrap:wrap}
.tec-opt{display:flex;align-items:center;gap:6px;padding:7px 12px;border:2px solid var(--bdr);border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;color:var(--g500)}
.tec-opt.sel{border-color:var(--gd);background:var(--gl);color:var(--gd)}
.tec-opt .chk{width:14px;height:14px;border-radius:4px;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.tec-opt.sel .chk{background:var(--gd);border-color:var(--gd);color:#fff}
.cat-dot{width:9px;height:9px;border-radius:50%}
.ev-modal-actions{display:flex;gap:10px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--bdr)}
.btn{padding:9px 18px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-ghost{background:var(--g100);color:var(--g800)}
.btn-primary{background:var(--gd);color:#fff}
.btn-danger{background:#fde;color:#c0392b;border:1px solid #f5b8b8}
.btn-danger:hover{background:#c0392b;color:#fff}

@media(max-width:860px){
  .cal-day{height:100px}
}
@media(max-width:640px){
  .fhd{padding:14px 16px}
  .lz{width:130px;height:60px}
  .hi h1{font-size:16px}
  .cal-day{height:82px;padding:4px}
  .ev-bar{font-size:9px;padding:2px 5px}
  .ev-row2{grid-template-columns:1fr}
}
</style>
</head>

/* ══════ HELPERS ══════ */
function fmtISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function catInfo(id){ return CATEGORIAS.find(c=>c.id===id) || CATEGORIAS[CATEGORIAS.length-1]; }
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

const DOW = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

/* ══════ RENDER: DOW HEADER ══════ */

/* ══════ RENDER: GRID ══════ */
const MAX_LANES = 3;

function renderGrid(){
  const ano = dataAtual.getFullYear();
  const mes = dataAtual.getMonth();
  document.getElementById('cal-title').textContent = `${MESES[mes]} de ${ano}`;

  const primeiroDia = new Date(ano, mes, 1);
  const ultimoDia = new Date(ano, mes+1, 0);
  const inicioGrid = new Date(primeiroDia);
  inicioGrid.setDate(inicioGrid.getDate() - primeiroDia.getDay());
  const totalSemanas = Math.ceil((ultimoDia.getDate() + primeiroDia.getDay()) / 7);

  const hoje = hojeISO();
  let html = '';

  for(let w=0; w<totalSemanas; w++){
    const weekStart = new Date(inicioGrid);
    weekStart.setDate(weekStart.getDate() + w*7);
    const weekDates = [...Array(7)].map((_,i)=>{
      const d = new Date(weekStart);
      d.setDate(d.getDate()+i);
      return d;
    });
    const weekISO = weekDates.map(fmtISO);

    let daysHtml = '';
    weekDates.forEach((d,i)=>{
      const iso = weekISO[i];
      const fora = d.getMonth() !== mes;
      const isHoje = iso === hoje;
      const diaSemana = d.getDay();
      const numCls = diaSemana === 0 ? 'sun' : (diaSemana === 6 ? 'sat' : '');
      daysHtml += `<div class="cal-day ${fora?'out':''} ${isHoje?'today':''}" onclick="abrirDiaModal('${iso}')">
        <span class="add-hint">&#43;</span>
        <div class="day-num ${numCls}">${d.getDate()}</div>
      </div>`;
    });

    const evsSemana = EVENTOS.filter(e=>{
      if(!categoriasAtivas.has(e.categoria)) return false;
      const fim = e.dataFim || e.data;
      return fim >= weekISO[0] && e.data <= weekISO[6];
    }).map(e=>{
      const fimReal = e.dataFim || e.data;
      const inicioClamp = e.data < weekISO[0] ? weekISO[0] : e.data;
      const fimClamp = fimReal > weekISO[6] ? weekISO[6] : fimReal;
      return {...e, _startCol: weekISO.indexOf(inicioClamp)+1, _endCol: weekISO.indexOf(fimClamp)+1};
    }).sort((a,b)=> a._startCol-b._startCol || (b._endCol-b._startCol)-(a._endCol-a._startCol) || (a.hora||'').localeCompare(b.hora||''));

    const lanes = [];
    evsSemana.forEach(e=>{
      let laneIdx = lanes.findIndex(lane => lane.every(seg => e._startCol > seg.end || e._endCol < seg.start));
      if(laneIdx===-1){ lanes.push([]); laneIdx = lanes.length-1; }
      lanes[laneIdx].push({start:e._startCol, end:e._endCol});
      e._lane = laneIdx;
    });

    const overflowPorCol = [0,0,0,0,0,0,0];
    evsSemana.forEach(e=>{
      if(e._lane >= MAX_LANES){
        for(let c=e._startCol;c<=e._endCol;c++) overflowPorCol[c-1]++;
      }
    });

    const barsHtml = evsSemana.filter(e=>e._lane<MAX_LANES).map(e=>{
      const cat = catInfo(e.categoria);
      return `<div class="ev-bar" style="grid-column:${e._startCol} / ${e._endCol+1}; grid-row:${e._lane+1}; background:${corEvento(e)}">${e.status==='cancelado'?'<s>'+esc(e.titulo)+'</s>':esc(e.titulo)}</div>`;
    }).join('');

    const overflowHtml = overflowPorCol.map((n,i)=> n>0 ? `<div class="ev-more" style="grid-column:${i+1}; grid-row:${MAX_LANES+1}">+${n} mais</div>` : '').join('');

    html += `<div class="week-row">
      <div class="week-days">${daysHtml}</div>
      <div class="week-events">${barsHtml}${overflowHtml}</div>
    </div>`;
  }

  document.getElementById('cal-grid').innerHTML = html;
}

/* ══════ RENDER: PRÓXIMOS EVENTOS ══════ */
function renderUpcoming(){
  const hoje = hojeISO();
  const proximos = EVENTOS
    .filter(e => e.data >= hoje && categoriasAtivas.has(e.categoria))
    .sort((a,b)=> (a.data+((a.hora)||'00:00')).localeCompare(b.data+((b.hora)||'00:00')))
    .slice(0, 6);
  if(!proximos.length){
    document.getElementById('upcoming').innerHTML = '<div class="empty-upcoming">Nenhum evento futuro.</div>';
    return;
  }
  document.getElementById('upcoming').innerHTML = proximos.map(e => {
    const cat = catInfo(e.categoria);
    const d = new Date(e.data+'T12:00:00');
    const dataFmt = d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
    const metaParts = [e.diaTodo ? 'Dia todo' : e.hora, e.pop, e.tecnico].filter(Boolean);
    return `<div class="upcoming-item" style="cursor:pointer" onclick="abrirDiaModal('${e.data}')">
      <div class="upcoming-date" style="color:${corEvento(e)}">${dataFmt}</div>
      <div class="upcoming-title">${esc(e.titulo)}</div>
      <div class="upcoming-meta">${esc(metaParts.join(' · '))}</div>
    </div>`;
  }).join('');
}

/* ══════ SWIPE (MOBILE) PARA TROCAR DE MÊS ══════ */
(function initSwipe(){
  const alvo = document.getElementById('cal-grid');
  let startX = 0, startY = 0, tocando = false;
  alvo.addEventListener('touchstart', e => {
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tocando = true;
  }, {passive:true});
  alvo.addEventListener('touchend', e => {
    if(!tocando) return;
    tocando = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    const LIMIAR = 50;
    if(Math.abs(dx) > LIMIAR && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) mudarMes(1); else mudarMes(-1);
    }
  }, {passive:true});
})();

  alvo.addEventListener('touchend', e => {
    if(!tocando || !diaModalAtual) return;
    tocando = false;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    const LIMIAR = 50;
    if(Math.abs(dx) > LIMIAR && Math.abs(dx) > Math.abs(dy) * 1.5){
      const novoDia = addDays(diaModalAtual, dx < 0 ? 1 : -1);
      abrirDiaModal(novoDia);
    }
  }, {passive:true});
})();

function toggleDiaTodo(){
  const ligado = document.getElementById('f-dia-todo').checked;
  document.getElementById('grp-horarios').style.display = ligado ? 'none' : 'grid';
  if(ligado){
    document.getElementById('f-hora').value = '';
    document.getElementById('f-hora-fim').value = '';
  }
}

/* ══════ DETALHE DO EVENTO ══════ */
const WD_ABBR = ['dom','seg','ter','qua','qui','sex','sáb'];
const MES_ABBR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
let detalheAtualId = null;

function fmtDataLonga(iso){
  const d = new Date(iso+'T12:00:00');
  return `${WD_ABBR[d.getDay()]}., ${d.getDate()} de ${MES_ABBR[d.getMonth()]}. de ${d.getFullYear()}`;
}

function getEv(id){ return EVENTOS.find(e=>e.id===id); }

function abrirDetalhe(id){
  detalheAtualId = id;
  const ev = getEv(id);
  if(!ev) return;
  if(!ev.fotos) ev.fotos = [];
  if(!ev.pdfs) ev.pdfs = [];
  if(!ev.comentarios) ev.comentarios = [];

  const cat = catInfo(ev.categoria);
  const inicial = (ev.tecnico || ev.titulo || '?').trim().charAt(0).toUpperCase();

  document.getElementById('det-avatar').textContent = inicial;
  document.getElementById('det-avatar').style.background = corEvento(ev);
  document.getElementById('det-title').textContent = ev.titulo;
  document.getElementById('det-title').style.color = cat.hex;

  let dataTxt = fmtDataLonga(ev.data);
  if(ev.dataFim && ev.dataFim !== ev.data){
    dataTxt += ` — ${fmtDataLonga(ev.dataFim)}`;
  }
  document.getElementById('det-date').textContent = dataTxt;

  let rows = '';
  rows += `<div class="det-row"><span class="ico">&#128197;</span><div class="txt">${esc(cat.label)}</div></div>`;
  if(ev.diaTodo){
    rows += `<div class="det-row"><span class="ico">&#8987;</span><div class="txt">Dia todo</div></div>`;
  } else if(ev.hora){
    rows += `<div class="det-row"><span class="ico">&#8987;</span><div class="txt">${esc(ev.hora)}${ev.horaFim ? ' — '+esc(ev.horaFim) : ''}</div></div>`;
  }
  if(ev.pop){
    rows += `<div class="det-row"><span class="ico">&#128225;</span><div class="txt">${esc(ev.pop)}</div></div>`;
  }
  if(ev.tecnico){
    rows += `<div class="det-row"><span class="ico">&#128100;</span><div class="txt">${esc(ev.tecnico)}</div></div>`;
  }
  if(ev.obs){
    rows += `<div class="det-row"><span class="ico">&#128221;</span><div class="txt">${esc(ev.obs)}</div></div>`;
  }
  document.getElementById('det-info-rows').innerHTML = rows;
  renderDetStatus();

  const FORM_LINKS = {
    preventiva:  {url:'preventiva_pop.html',              label:'Iniciar formulário de Preventiva'},
    manutencao:  {url:'manutencao_pop.html',               label:'Iniciar formulário de Manutenção'},
    transceiver: {url:'expansao_pop.html',                 label:'Iniciar formulário de Expansão Transceiver'},
    infra:       {url:'expansao_pop_infraestrutura.html',  label:'Iniciar formulário de Expansão Infraestrutura'},
  };
  const formInfo = FORM_LINKS[ev.categoria];
  document.getElementById('det-form-cta').innerHTML = formInfo
    ? `<a class="det-form-cta" style="background:${cat.hex}" href="${formInfo.url}" target="_blank">&#128203; ${esc(formInfo.label)}<span class="arrow">&#8594;</span></a>`
    : '';

  renderDetFotos();
  renderDetPdfs();
  renderDetComentarios();

  document.getElementById('det-menu-dd').classList.remove('show');
  document.getElementById('det-modal-bg').classList.add('show');
}
function fecharDetalhe(){
  document.getElementById('det-modal-bg').classList.remove('show');
  document.getElementById('det-menu-dd').classList.remove('show');
}

function toggleMenu3Pontos(evt){
  evt.stopPropagation();
  document.getElementById('det-menu-dd').classList.toggle('show');
}
document.addEventListener('click', () => {
  document.getElementById('det-menu-dd').classList.remove('show');
});

function acaoEditar(){
  const id = detalheAtualId;
  const ev = getEv(id);
  fecharDetalhe();
  abrirModal(ev.data, id);
}
async function acaoExcluir(){
  const id = detalheAtualId;
  if(!confirm('Excluir este evento?')) return;
  try{
    const { error } = await supabaseClient.from(TABLE_AGENDA).delete().eq('id', id);
    if(error) throw error;
    EVENTOS = EVENTOS.filter(e=>e.id!==id);
    fecharDetalhe();
    renderGrid(); renderUpcoming();
  }catch(e){
    alert('Erro ao excluir o evento: ' + e.message);
  }
}

/* ── COPIAR PARA OUTRO DIA ── */
function abrirCopiarModal(){
  document.getElementById('det-menu-dd').classList.remove('show');
  const ev = getEv(detalheAtualId);
  document.getElementById('copy-nova-data').value = ev.data;
  document.getElementById('copy-modal-bg').classList.add('show');
}
function fecharCopiarModal(){
  document.getElementById('copy-modal-bg').classList.remove('show');
}
async function confirmarCopiar(){
  const novaData = document.getElementById('copy-nova-data').value;
  if(!novaData){ alert('Escolha uma data.'); return; }
  const ev = getEv(detalheAtualId);
  let novaDataFim = '';
  if(ev.dataFim && ev.dataFim !== ev.data){
    const delta = (new Date(ev.dataFim+'T12:00:00') - new Date(ev.data+'T12:00:00')) / 86400000;
    novaDataFim = addDays(novaData, delta);
  }
  const payload = eventoToRow({...ev, data: novaData, dataFim: novaDataFim});
  try{
    const { data: rows, error } = await supabaseClient.from(TABLE_AGENDA).insert(payload).select();
    if(error) throw error;
    EVENTOS.push(rowToEvento(rows[0]));
    fecharCopiarModal();
    fecharDetalhe();
    renderGrid(); renderUpcoming();
  }catch(e){
    alert('Erro ao copiar o evento: ' + e.message);
  }
}
document.getElementById('copy-modal-bg').addEventListener('click', e=>{ if(e.target===e.currentTarget) fecharCopiarModal(); });
document.getElementById('det-modal-bg').addEventListener('click', e=>{ if(e.target===e.currentTarget) fecharDetalhe(); });

/* ── ANEXOS: FOTOS ── */
function renderDetFotos(){
  const ev = getEv(detalheAtualId);
  const grid = document.getElementById('det-fotos-grid');
  if(!ev.fotos.length){ grid.innerHTML = ''; return; }
  grid.innerHTML = ev.fotos.map((src,i) => `
    <div class="det-foto-item">
      <img src="${src}" alt="" onclick="abrirFotoAmpliada('${src}')">
      <button class="det-foto-rm" onclick="event.stopPropagation();removerFoto(${i})">&#10005;</button>
    </div>`).join('');
}
function abrirFotoAmpliada(src){
  document.getElementById('foto-ampliada-img').src = src;
  document.getElementById('foto-ampliada-bg').classList.add('show');
}
function fecharFotoAmpliada(){
  document.getElementById('foto-ampliada-bg').classList.remove('show');
}
async function atualizarArrayEvento(campo, novoArray){
  const ev = getEv(detalheAtualId);
  const { error } = await supabaseClient.from(TABLE_AGENDA).update({ [campo]: novoArray }).eq('id', ev.id);
  if(error) throw error;
  ev[campo] = novoArray;
}

async function handleFotoUpload(input){
  const ev = getEv(detalheAtualId);
  const files = Array.from(input.files||[]);
  if(!files.length) return;
  input.value = '';
  try{
    const urls = [];
    for(let i=0;i<files.length;i++){
      const file = files[i];
      const ext = (file.name.split('.').pop()||'jpg').toLowerCase();
      const fileName = `${ev.id}_${Date.now()}_${i}.${ext}`;
      const { error: upErr } = await supabaseClient.storage.from(BUCKET_FOTOS).upload(fileName, file, { contentType: file.type || 'image/jpeg', upsert: true });
      if(upErr) throw upErr;
      const { data } = supabaseClient.storage.from(BUCKET_FOTOS).getPublicUrl(fileName);
      urls.push(data.publicUrl);
    }
    await atualizarArrayEvento('fotos', [...ev.fotos, ...urls]);
    renderDetFotos();
  }catch(e){
    alert('Erro ao enviar foto: ' + e.message);
  }
}
async function removerFoto(i){
  if(!confirm('Excluir esta foto?')) return;
  const ev = getEv(detalheAtualId);
  const novoArray = ev.fotos.filter((_,idx)=>idx!==i);
  try{
    await atualizarArrayEvento('fotos', novoArray);
    renderDetFotos();
  }catch(e){
    alert('Erro ao remover foto: ' + e.message);
  }
}

/* ── ANEXOS: PDFS ── */
function renderDetPdfs(){
  const ev = getEv(detalheAtualId);
  const list = document.getElementById('det-pdfs-list');
  if(!ev.pdfs.length){ list.innerHTML = ''; return; }
  list.innerHTML = ev.pdfs.map((p,i) => `
    <div class="det-pdf-item">
      <span>&#128196;</span>
      <a href="${p.url}" target="_blank">${esc(p.name)}</a>
      <button class="det-pdf-rm" onclick="removerPdf(${i})">&#10005;</button>
    </div>`).join('');
}
async function handlePdfUpload(input){
  const ev = getEv(detalheAtualId);
  const files = Array.from(input.files||[]);
  if(!files.length) return;
  input.value = '';
  try{
    const novosPdfs = [];
    for(let i=0;i<files.length;i++){
      const file = files[i];
      const fileName = `${ev.id}_${Date.now()}_${i}_${file.name}`.replace(/\s+/g,'_');
      const { error: upErr } = await supabaseClient.storage.from(BUCKET_PDFS).upload(fileName, file, { contentType: 'application/pdf', upsert: true });
      if(upErr) throw upErr;
      const { data } = supabaseClient.storage.from(BUCKET_PDFS).getPublicUrl(fileName);
      novosPdfs.push({ name: file.name, url: data.publicUrl });
    }
    await atualizarArrayEvento('pdfs', [...ev.pdfs, ...novosPdfs]);
    renderDetPdfs();
  }catch(e){
    alert('Erro ao enviar PDF: ' + e.message);
  }
}
async function removerPdf(i){
  const ev = getEv(detalheAtualId);
  const novoArray = ev.pdfs.filter((_,idx)=>idx!==i);
  try{
    await atualizarArrayEvento('pdfs', novoArray);
    renderDetPdfs();
  }catch(e){
    alert('Erro ao remover PDF: ' + e.message);
  }
}

/* ── COMENTÁRIOS ── */
function renderDetComentarios(){
  const ev = getEv(detalheAtualId);
  const box = document.getElementById('det-comentarios');
  if(!ev.comentarios.length){
    box.innerHTML = '<div class="det-comment-empty">Nenhum comentário ainda.</div>';
    return;
  }
  box.innerHTML = ev.comentarios.map(c => `
    <div class="det-comment">
      <div class="det-comment-av">${esc((c.autor||'?').charAt(0).toUpperCase())}</div>
      <div class="det-comment-body">
        ${esc(c.texto)}
        <div class="det-comment-meta">${esc(c.autor||'Você')} · ${esc(c.dataFmt||'')}</div>
      </div>
    </div>`).join('');
}
async function adicionarComentario(){
  const input = document.getElementById('det-comment-input');
  const texto = input.value.trim();
  if(!texto) return;
  const ev = getEv(detalheAtualId);
  const agora = new Date();
  const novoComentario = {
    texto,
    autor: 'Você',
    dataFmt: agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
  };
  try{
    await atualizarArrayEvento('comentarios', [...ev.comentarios, novoComentario]);
    input.value = '';
    renderDetComentarios();
  }catch(e){
    alert('Erro ao salvar comentário: ' + e.message);
  }
}

let statusPendente = null;

function renderDetStatus(){
  const ev = getEv(detalheAtualId);
  statusPendente = ev.status || STATUS_DEFAULT;
  desenharStatusPicker();
}
function desenharStatusPicker(){
  const ev = getEv(detalheAtualId);
  const atual = ev.status || STATUS_DEFAULT;
  const html = STATUS.map(s => {
    const sel = statusPendente === s.id;
    const style = sel ? `background:${s.hex}` : '';
    return `<div class="det-status-opt ${sel?'sel':''}" style="${style}" onclick="selecionarStatusPendente('${s.id}')">
      <span class="dot" style="background:${sel?'#fff':s.hex}"></span>${esc(s.label)}
    </div>`;
  }).join('');
  const mudou = statusPendente !== atual;
  const saveBtn = mudou ? `<button class="btn btn-primary det-status-save" onclick="confirmarStatus()">&#10003; Salvar status</button>` : '';
  document.getElementById('det-status-picker').innerHTML = `<div class="det-status-title">Status</div><div class="det-status-picker">${html}</div>${saveBtn}`;
}
function selecionarStatusPendente(status){
  statusPendente = status;
  desenharStatusPicker();
}
async function confirmarStatus(){
  const ev = getEv(detalheAtualId);
  try{
    const { error } = await supabaseClient.from(TABLE_AGENDA).update({ status: statusPendente }).eq('id', ev.id);
    if(error) throw error;
    ev.status = statusPendente;
    desenharStatusPicker();
    document.getElementById('det-avatar').style.background = corEvento(ev);
    renderGrid(); renderUpcoming();
  }catch(e){
    alert('Erro ao salvar status: ' + e.message);
  }
}

function abrirModal(dataISO, eventoId){
  editandoId = eventoId || null;
  const ev = eventoId ? EVENTOS.find(e=>e.id===eventoId) : null;

  document.getElementById('modal-title').textContent = ev ? 'Editar Evento' : 'Novo Evento';
  document.getElementById('btn-excluir').style.display = ev ? 'inline-flex' : 'none';
  document.getElementById('f-titulo').value = ev ? ev.titulo : '';
  document.getElementById('f-data').value = ev ? ev.data : dataISO;
  document.getElementById('f-data-fim').value = ev ? (ev.dataFim||'') : '';
  document.getElementById('f-dia-todo').checked = ev ? !!ev.diaTodo : false;
  document.getElementById('f-status').value = ev ? (ev.status||STATUS_DEFAULT) : STATUS_DEFAULT;
  document.getElementById('f-hora').value = ev ? (ev.hora||'') : '';
  document.getElementById('f-hora-fim').value = ev ? (ev.horaFim||'') : '';
  document.getElementById('f-pop').value = ev ? (ev.pop||'') : '';
  const tecnicosAtuais = ev && ev.tecnico ? ev.tecnico.split(',').map(t=>t.trim()).filter(Boolean) : [];
  renderTecPicker(tecnicosAtuais);
  document.getElementById('f-obs').value = ev ? (ev.obs||'') : '';
  toggleDiaTodo();

  renderCatPicker(ev ? ev.categoria : 'preventiva');
  document.getElementById('cat-picker').dataset.selecionada = ev ? ev.categoria : 'preventiva';

  document.getElementById('modal-bg').classList.add('show');
}
function fecharModal(){
  document.getElementById('modal-bg').classList.remove('show');
  editandoId = null;
}

async function salvarEvento(){
  const titulo = document.getElementById('f-titulo').value.trim();
  const data = document.getElementById('f-data').value;
  if(!titulo || !data){ alert('Preencha ao menos o título e a data.'); return; }
  let dataFim = document.getElementById('f-data-fim').value;
  if(dataFim && dataFim < data) dataFim = data;
  const categoria = document.getElementById('cat-picker').dataset.selecionada || 'outro';
  const diaTodo = document.getElementById('f-dia-todo').checked;
  const payload = {
    titulo,
    data,
    dataFim: dataFim || '',
    diaTodo,
    hora: diaTodo ? '' : document.getElementById('f-hora').value,
    horaFim: diaTodo ? '' : document.getElementById('f-hora-fim').value,
    categoria,
    status: document.getElementById('f-status').value || STATUS_DEFAULT,
    pop: document.getElementById('f-pop').value.trim(),
    tecnico: Array.from(tecnicosSelecionados).join(', '),
    obs: document.getElementById('f-obs').value.trim(),
  };
  const btnSalvar = document.querySelector('#modal-bg .btn-primary');
  if(btnSalvar){ btnSalvar.disabled = true; btnSalvar.textContent = 'Salvando...'; }
  try{
    if(editandoId){
      const { data: rows, error } = await supabaseClient.from(TABLE_AGENDA).update(eventoToRow(payload)).eq('id', editandoId).select();
      if(error) throw error;
      const idx = EVENTOS.findIndex(e=>e.id===editandoId);
      EVENTOS[idx] = rowToEvento(rows[0]);
    } else {
      const { data: rows, error } = await supabaseClient.from(TABLE_AGENDA).insert(eventoToRow(payload)).select();
      if(error) throw error;
      EVENTOS.push(rowToEvento(rows[0]));
    }
    fecharModal();
    renderGrid(); renderUpcoming();
  }catch(e){
    alert('Erro ao salvar o evento: ' + e.message);
  }finally{
    if(btnSalvar){ btnSalvar.disabled = false; btnSalvar.textContent = 'Salvar'; }
  }
}

async function excluirEvento(){
  if(!editandoId) return;
  if(!confirm('Excluir este evento?')) return;
  try{
    const { error } = await supabaseClient.from(TABLE_AGENDA).delete().eq('id', editandoId);
    if(error) throw error;
    EVENTOS = EVENTOS.filter(e=>e.id!==editandoId);
    fecharModal();
    renderGrid(); renderUpcoming();
  }catch(e){
    alert('Erro ao excluir o evento: ' + e.message);
  }
}

document.getElementById('modal-bg').addEventListener('click', e=>{ if(e.target===e.currentTarget) fecharModal(); });

/* ══════ INIT ══════ */
(async function init(){
  renderDow();
  await carregarEventos();
  renderGrid();
  renderUpcoming();
})();
</script>
